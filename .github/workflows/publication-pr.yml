name: Publication submission

# GitHub-native publication pipeline:
#   issue form -> validate + dedupe -> branch + commit -> pull request
#   PR merged  -> close + label the submission issue -> site rebuilds
#
# The PR base branch is controlled by the repository variable
# PUBLICATION_BASE_BRANCH (Settings -> Secrets and variables -> Actions ->
# Variables). It defaults to master (production); set it to test/publications
# to run a test round without touching the live site — no code change needed.

on:
  issues:
    types: [opened, reopened, edited]  # edited/reopened => automatic reprocess
  pull_request:
    types: [closed]
  workflow_dispatch:                   # manual "Run workflow" (optional issue number)
    inputs:
      issue-number:
        description: "Reprocess one open issue (blank = sweep all)"
        required: false
  schedule:
    - cron: "23 4 * * 1"               # weekly self-heal sweep
  push:
    branches: [master]
    paths:
      - .github/workflows/publication-pr.yml
      - scripts/publication_workflow.py

# Serialize runs so two submissions can never race on the data file.
concurrency:
  group: publication-workflow
  cancel-in-progress: false

permissions:
  contents: write       # branch + commit the new entry
  issues: write         # comment / label / close submission issues
  pull-requests: write  # create PRs

jobs:
  submission:
    name: Submission -> pull request
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.body, '### Publication title')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate, create branch + PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_BASE_BRANCH: ${{ vars.PUBLICATION_BASE_BRANCH || 'master' }}
        run: python3 scripts/publication_workflow.py submission

  merged:
    name: Mark submission published
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.title, '[New Publication]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Close and label the submission issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publication_workflow.py merge

  sweep:
    name: Self-heal sweep
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reprocess open submissions without PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_BASE_BRANCH: ${{ vars.PUBLICATION_BASE_BRANCH || 'master' }}
          SWEEP_ISSUE_NUMBER: ${{ github.event.inputs.issue-number }}
        run: python3 scripts/publication_workflow.py sweep
